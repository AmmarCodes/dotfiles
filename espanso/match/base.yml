# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.
global_vars:
  - name: "clipboard"
    type: "clipboard"
  - name: "date"
    type: "date"
    params:
      format: "%Y-%m-%d"

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.
matches:
  - trigger: ";date"
    replace: "{{date}}"

  - trigger: ";time"
    replace: "{{time}}"
    vars:
      - name: time
        type: date
        params:
          format: "%H:%M"

  - trigger: ";dmon"
    replace: "{{dmon}}"
    vars:
      - name: dmon
        type: date
        params:
          format: "%Y-%m"

  - trigger: ";dtime"
    replace: "{{dtime}}"
    vars:
      - name: dtime
        type: date
        params:
          format: "%Y-%m-%d %H:%M"

  - trigger: ";rev"
    replace: |
      Hey @{{clipboard}} :wave:

      Would you review this pull request, please?

      Thanks!

  - trigger: ";details"
    replace: |
      <details>
        <summary>$|$</summary>

      </details>

  - trigger: ";gf"
    replace: "git commit --fixup={{clipboard}}"

  - trigger: ";shots"
    replace: "| before | after |\n| ------ | ------ |\n| $|$ |  |"

  # Print the output of a shell command
  # - trigger: ";shell"
  #   replace: "{{output}}"
  #   vars:
  #     - name: output
  #       type: shell
  #       params:
  #         cmd: "echo 'Hello from your shell'"

  # And much more! For more information, visit the docs: https://espanso.org/docs/
